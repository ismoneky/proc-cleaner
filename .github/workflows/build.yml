name: build

# 云端编译 Windows exe。本机不需要安装 Rust。
#
# 触发方式：
#   - push 到 main/master        -> 自动构建，并更新 latest 发布
#   - Actions 页面 Run workflow   -> 手动构建
#   - push 形如 v0.1.0 的 tag     -> 构建并发布带版本号的 Release
#
# 构建成功后有两个下载途径：
#   1. Actions 页面的 Artifacts（需要登录，zip 包，有保留期）
#   2. 永久直链（推荐，公开仓库无需登录）：
#        https://github.com/<owner>/<repo>/releases/latest/download/proc-cleaner.exe
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # windows-latest 已预装 Rust 与 MSVC 链接器，这里固定用 stable MSVC，
      # 避免默认落到 GNU 变体上。
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # 先 check：编译错误在这一步就会明确报出来，且比 build 快
      - name: cargo check
        run: cargo check --release --verbose

      - name: cargo build
        run: cargo build --release --verbose

      # 打印实际解析到的依赖版本，方便排查「本地能编、CI 不能编」这类问题
      - name: Resolved dependency versions
        shell: pwsh
        run: |
          Write-Host "----- Cargo.lock (key crates) -----"
          if (Test-Path Cargo.lock) {
            Select-String -Path Cargo.lock -Pattern '^name = "(windows|egui|eframe|epaint|sysinfo|winit)"' -Context 0,1 |
              ForEach-Object { $_.Line + " " + ($_.Context.PostContext -join '') }
          } else {
            Write-Host "no Cargo.lock generated"
          }
          $exe = "target\release\proc-cleaner.exe"
          if (-not (Test-Path $exe)) { throw "artifact not found: $exe" }
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 2)
          Write-Host "----- built proc-cleaner.exe ($mb MB) -----"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: proc-cleaner-exe
          path: target/release/proc-cleaner.exe
          if-no-files-found: error

      # 带版本号的 tag -> 建一个正式 Release
      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "target/release/proc-cleaner.exe" `
            --title "${{ github.ref_name }}" `
            --notes "Automated build of proc-cleaner."

      # 每次 push 到主分支都刷新 latest 发布，得到一个固定不变的下载直链
      - name: Update latest release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $notes = "Automated build from commit ${{ github.sha }}."
          gh release view latest 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload latest "target/release/proc-cleaner.exe" --clobber
          } else {
            gh release create latest "target/release/proc-cleaner.exe" --title "latest" --notes $notes
          }
